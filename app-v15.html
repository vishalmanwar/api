<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zipify Rank Intelligence</title>
<meta name="description" content="Amazon keyword rank and sponsored visibility dashboard for Zipify.">
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f7f7f5}
*{box-sizing:border-box}body{margin:0}.hidden{display:none!important}button,input,select,textarea{font:inherit}
.login-shell{min-height:100vh;display:grid;place-items:center;padding:22px}.login-card{width:min(410px,100%);background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:30px;box-shadow:0 16px 50px rgba(0,0,0,.05)}
.logo{font-size:19px;font-weight:750;margin-bottom:5px}.sub{color:#737373;font-size:13px;line-height:1.45;margin-bottom:24px}
label{font-size:12px;font-weight:650;display:block;margin:13px 0 6px}.field{width:100%;padding:10px 11px;border:1px solid #d8d8d8;border-radius:8px;background:#fff;color:#171717;outline:none}.field:focus{border-color:#777}
button{cursor:pointer}.primary{padding:10px 14px;border:0;border-radius:8px;background:#171717;color:#fff;font-weight:650}.secondary{padding:9px 12px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#222}.danger{color:#9b2c2c}
.login-card .primary{width:100%;margin-top:20px}.err{background:#fff1f1;color:#9b2c2c;border:1px solid #f1cccc;padding:9px 10px;border-radius:7px;font-size:12px;margin-bottom:12px}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
aside{background:#111;color:#d2d2d2;padding:26px 15px;position:sticky;top:0;height:100vh}.brand{font-weight:740;color:#fff;font-size:17px;margin:0 4px 28px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#c9c9c9;text-align:left;padding:9px 10px;border-radius:7px;font-size:13px}.nav button:hover{background:#1c1c1c;color:#fff}.nav button.active{background:#242424;color:#fff}.aside-foot{position:absolute;bottom:20px;left:15px;right:15px}.logout{width:100%;border:1px solid #333;background:transparent;color:#bbb;border-radius:7px;padding:8px}
main{padding:32px 36px;max-width:1550px;width:100%}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:20px}.top h1{font-size:24px;margin:0 0 3px}.muted{color:#737373;font-size:13px}.tiny{font-size:11px;color:#888}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}.stat{background:#fff;border:1px solid #e7e7e7;border-radius:10px;padding:16px}.stat b{display:block;font-size:25px;margin-top:6px}.stat span{font-size:11px;color:#737373;text-transform:uppercase;letter-spacing:.04em}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,390px);gap:16px;align-items:start}.panel{background:#fff;border:1px solid #e7e7e7;border-radius:10px;overflow:hidden;margin-bottom:16px}.panelhead{padding:15px 17px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;gap:15px}.panelbody{padding:16px 17px}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid #f0f0f0;white-space:nowrap}th{font-size:10px;text-transform:uppercase;color:#737373;font-weight:650;background:#fcfcfc;letter-spacing:.035em}
.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:650;background:#f1f1f1}.good{background:#eaf6ee;color:#287442}.warn{background:#fff5d8;color:#8a6410}.bad{background:#fdeaea;color:#a33}.blue{background:#eaf1ff;color:#2f5eae}
.empty{color:#999}.loader{padding:28px;color:#777}.note{margin-top:15px;padding:12px 14px;border:1px solid #e7e7e7;border-radius:9px;background:#fff;font-size:13px;color:#666;line-height:1.45}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#b45309;margin-right:7px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}.formgrid .full{grid-column:1/-1}.actions{display:flex;gap:8px;align-items:center;margin-top:14px}.btn-sm{padding:6px 9px;border:1px solid #ddd;border-radius:7px;background:#fff;font-size:12px}.btn-sm:hover{background:#f6f6f6}
.empty-state{padding:35px 20px;text-align:center;color:#777}.empty-state b{display:block;color:#333;margin-bottom:5px}.section-title{font-size:16px;font-weight:700}.metricline{display:flex;justify-content:space-between;gap:20px;padding:9px 0;border-bottom:1px solid #f1f1f1}.metricline:last-child{border-bottom:0}.toast{position:fixed;right:20px;bottom:20px;background:#171717;color:#fff;padding:11px 14px;border-radius:9px;font-size:13px;box-shadow:0 8px 25px rgba(0,0,0,.2);z-index:50}.toast.error{background:#8f2929}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:780px){.layout{grid-template-columns:1fr}aside{position:relative;height:auto}.nav{grid-template-columns:repeat(2,1fr)}.aside-foot{position:static;margin-top:15px}main{padding:22px 12px}.stats{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.formgrid .full{grid-column:auto}}
</style>
</head>
<body>
<section id="login" class="login-shell">
  <form id="loginForm" class="login-card">
    <div class="logo">Zipify Rank Intelligence</div>
    <div class="sub">Private Amazon India + USA search visibility dashboard.<br><span class="tiny">Build 2026.09.25.42</span></div>
    <div id="loginError" class="err hidden">Incorrect username or password.</div>
    <label>Username</label><input id="username" class="field" autocomplete="username" value="vishal" required>
    <label>Password</label><input id="password" class="field" type="password" autocomplete="current-password" required autofocus>
    <button class="primary" type="submit">Sign in</button>
  </form>
</section>

<section id="app" class="layout hidden">
  <aside>
    <div class="brand">Zipify Rank<br>Intelligence</div>
    <div style="margin:0 4px 20px">
      <div class="tiny" style="color:#888;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em">Market</div>
      <select id="marketSelect" class="field" style="background:#1b1b1b;color:#fff;border-color:#333">
        <option value="IN">India</option>
        <option value="US">USA</option>
      </select>
    </div>
    <div class="nav" id="nav">
      <button data-view="dashboard">Dashboard</button>
      <button data-view="products">Products</button>
      <button data-view="keywords">Keywords</button>
      <button data-view="campaigns">Ranking Campaigns</button>
      <button data-view="advertising">Advertising</button>
      <button data-view="alerts">Alerts</button>
      <button data-view="reports">Reports</button>
      <button data-view="settings">Settings</button>
    </div>
    <div class="aside-foot"><button id="logout" class="logout">Sign out</button></div>
  </aside>
  <main id="main"><div class="loader">Loading…</div></main>
</section>
<div id="toast" class="toast hidden"></div>

<script>
const API='https://ywrtgkdkntjyeqdnrbop.supabase.co/functions/v1/rank-intelligence';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let selectedMarket=localStorage.getItem('zri_market')||'IN';
let marketsLoaded=false;
let marketCatalog={
  IN:{market_key:'IN',market_name:'India',marketplace:'amazon.in',currency_code:'INR',timezone:'Asia/Kolkata',location_type:'pincode',location_value:'500001',ads_region:'FE'},
  US:{market_key:'US',market_name:'USA',marketplace:'amazon.com',currency_code:'USD',timezone:'America/Chicago',location_type:'postal_code',location_value:'',ads_region:'NA'}
};
let currentMarket=marketCatalog[selectedMarket]||marketCatalog.IN;
const money=n=>new Intl.NumberFormat(currentMarket.currency_code==='USD'?'en-US':'en-IN',{style:'currency',currency:currentMarket.currency_code||'INR',maximumFractionDigits:2}).format(Number(n||0));
const num=n=>new Intl.NumberFormat(currentMarket.currency_code==='USD'?'en-US':'en-IN').format(Number(n||0));
const pct=n=>n==null?'—':Number(n).toFixed(1)+'%';
const dateFmt=v=>v?new Date(v).toLocaleDateString('en-US',{timeZone:currentMarket.timezone||'UTC',day:'2-digit',month:'short',year:'numeric'}):'—';
const dateTimeFmt=v=>v?new Date(v).toLocaleString('en-US',{timeZone:currentMarket.timezone||'UTC',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true,timeZoneName:'short'}):'—';
const marketFlag=()=>currentMarket.market_key==='US'?'USA':'India';
const marketTitle=()=>marketFlag();
const locationLabelUi=()=>currentMarket.location_type==='postal_code'?'ZIP code':'pincode';
function setCurrentMarket(key){
  selectedMarket=String(key||'IN').toUpperCase();
  currentMarket=marketCatalog[selectedMarket]||marketCatalog.IN;
  localStorage.setItem('zri_market',selectedMarket);
  if($('marketSelect')) $('marketSelect').value=selectedMarket;
}
async function ensureMarkets(){
  if(marketsLoaded){setCurrentMarket(selectedMarket);return}
  const d=await api('/markets');
  for(const m of d.markets||[]) marketCatalog[m.market_key]=m;
  marketsLoaded=true;
  if(!marketCatalog[selectedMarket]) selectedMarket='IN';
  setCurrentMarket(selectedMarket);
  const s=$('marketSelect');
  if(s){
    s.innerHTML=Object.values(marketCatalog).filter(m=>m.enabled!==false).map(m=>'<option value="'+esc(m.market_key)+'">'+esc(m.market_name)+'</option>').join('');
    s.value=selectedMarket;
  }
}
function parseCsv(text){
  const rows=[];let row=[],field='',quoted=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i],next=text[i+1];
    if(ch==='"'){
      if(quoted&&next==='"'){field+='"';i++;}else quoted=!quoted;
    }else if(ch===','&&!quoted){row.push(field);field='';}
    else if((ch==='\n'||ch==='\r')&&!quoted){
      if(ch==='\r'&&next==='\n')i++;
      row.push(field);field='';
      if(row.some(x=>String(x).trim()!==''))rows.push(row);
      row=[];
    }else field+=ch;
  }
  if(field||row.length){row.push(field);if(row.some(x=>String(x).trim()!==''))rows.push(row);}
  if(rows.length<2)return [];
  const headers=rows[0].map(h=>String(h).trim());
  return rows.slice(1).map(r=>Object.fromEntries(headers.map((h,i)=>[h,String(r[i]??'').trim()])));
}
function normalizeKey(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function firstField(row,aliases){
  const map=new Map(Object.entries(row).map(([k,v])=>[normalizeKey(k),v]));
  for(const a of aliases){const v=map.get(normalizeKey(a));if(v!==undefined&&String(v).trim()!=='')return String(v).trim()}
  return '';
}
function cleanNumber(v){
  const n=Number(String(v||'').replace(/[^0-9.-]/g,''));
  return Number.isFinite(n)?n:0;
}
function normalizeAdDate(v){
  const s=String(v||'').trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  const d=new Date(s);
  if(Number.isNaN(d.getTime()))return '';
  return d.toISOString().slice(0,10);
}
function adRowsFromCsv(text){
  return parseCsv(text).map(r=>({
    metric_date:normalizeAdDate(firstField(r,['Date','Start Date','Start date'])),
    campaign_name:firstField(r,['Campaign Name','Campaign']),
    campaign_id:firstField(r,['Campaign ID','Campaign Id']),
    ad_group_name:firstField(r,['Ad Group Name','Ad group name']),
    ad_group_id:firstField(r,['Ad Group ID','Ad group ID']),
    target:firstField(r,['Targeting','Keyword','Customer Search Term','Search Term','Target']),
    keyword:firstField(r,['Keyword','Targeting']),
    match_type:firstField(r,['Match Type','Match type']),
    asin:firstField(r,['Advertised ASIN','Advertised Asin','ASIN','Asin']),
    impressions:cleanNumber(firstField(r,['Impressions'])),
    clicks:cleanNumber(firstField(r,['Clicks'])),
    spend:cleanNumber(firstField(r,['Spend','Cost'])),
    orders:cleanNumber(firstField(r,['Purchases','Orders','7 Day Total Orders (#)','7-day total orders'])),
    units:cleanNumber(firstField(r,['Units','Units Sold','7 Day Total Units (#)','7-day total units'])),
    sales:cleanNumber(firstField(r,['Sales','7 Day Total Sales','7-day total sales']))
  })).filter(r=>r.metric_date);
}


function authHeader(){const token=sessionStorage.getItem('zri_session');return token?{'X-Zipify-Session':token}:{}}
function showLogin(){ $('app').classList.add('hidden');$('login').classList.remove('hidden');$('password').value=''}
function showApp(){ $('login').classList.add('hidden');$('app').classList.remove('hidden')}
function toast(msg,error=false){const t=$('toast');t.textContent=msg;t.className='toast'+(error?' error':'');setTimeout(()=>t.classList.add('hidden'),2600)}
function apiUrl(path){
  const parts=String(path||'').split('?');
  const clean=parts[0].split('/').filter(Boolean).join('/');
  const seg=clean?clean.split('/'):[];
  let action=seg[0]||'health';
  const params=new URLSearchParams(parts[1]||'');
  if(action==='products'&&seg[1]){action='product_update';params.set('id',seg[1])}
  params.set('action',action);
  if(!params.has('market')) params.set('market',selectedMarket);
  return API+'?'+params.toString();
}
async function api(path,opts={}){
  const headers={...authHeader(),'Content-Type':'application/json',...(opts.headers||{})};
  const r=await fetch(apiUrl(path),{...opts,headers});
  if(r.status===401){sessionStorage.removeItem('zri_session');sessionStorage.removeItem('zri_auth');showLogin();$('loginError').classList.remove('hidden');throw new Error('Unauthorized')}
  let data={};try{data=await r.json()}catch{}
  if(!r.ok) throw new Error(data.error||('Request failed: '+r.status));
  return data;
}
function setNav(view){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view))}
function pageHead(title,sub,action=''){return '<div class="top"><div><h1>'+esc(title)+'</h1><div class="muted">'+esc(sub)+'</div></div>'+action+'</div>'}
function statusBadge(status){
  const cls=status==='On target'?'good':status==='Warning'?'warn':status==='Critical'?'bad':status==='Active'?'good':'';
  return '<span class="badge '+cls+'">'+esc(status)+'</span>';
}
function emptyState(title,text){return '<div class="empty-state"><b>'+esc(title)+'</b>'+esc(text)+'</div>'}

async function renderDashboard(){
  $('main').innerHTML=pageHead('Search visibility',marketTitle()+' · '+currentMarket.marketplace+' · '+locationLabelUi()+'-based rank monitoring')+'<div class="loader">Loading dashboard…</div>';
  const [d,p]=await Promise.all([api('/dashboard'),api('/provider_status')]);
  const rows=d.rows.map(x=>{
    const rank=x.organic_rank==null?'<span class="empty">No data</span>':'#'+x.organic_rank;
    const sponsored=x.sponsored_position!=null
      ? '#'+x.sponsored_position
      : (x.latest_check_status==='SUCCESS' && x.sponsored_found===false
          ? '<span class="empty">Not found</span>'
          : '<span class="empty">No data</span>');
    const status=x.organic_rank==null?'Awaiting data':(x.organic_rank<=x.target_rank?'On target':(x.organic_rank>=x.critical_rank?'Critical':'Warning'));
    const lastChecked=dateTimeFmt(x.latest_checked_at);
    return '<tr><td><b>'+esc(x.product_name)+'</b><div class="tiny">'+esc(x.asin)+'</div></td><td>'+esc(x.keyword)+'</td><td><span class="badge '+(x.priority==='critical'?'bad':x.priority==='high'?'warn':'')+'">'+esc(x.priority)+'</span></td><td>'+esc(x.location_pincode||p.pincode||'—')+'</td><td>'+(x.search_volume??'—')+'</td><td>'+rank+'</td><td>Top '+x.target_rank+'</td><td>'+sponsored+'</td><td>'+pct(x.sponsored_visibility)+'</td><td>'+statusBadge(status)+'</td><td><span class="tiny">'+esc(lastChecked)+'</span></td></tr>';
  }).join('');
  const locationReady=String(currentMarket.location_value||'').trim()!=='';
  const action=!locationReady
    ? '<button id="configureMarket" class="primary">Configure '+esc(locationLabelUi())+'</button>'
    : (p.connected?'<button id="runRankCheck" class="primary">Run live rank check</button>':'<button id="connectProvider" class="secondary">Set up rank agent</button>');
  const providerNote=!locationReady
    ? '<div class="note"><span class="badge warn">Setup required</span> Set the '+esc(currentMarket.market_name)+' '+esc(locationLabelUi())+' in Settings before creating tracking rules or running checks.</div>'
    : (p.connected
      ? '<div class="note"><span class="badge good">Connected</span> <b>'+esc(p.provider_name||'Zipify Opera Rank Extension')+'</b> · '+esc(locationLabelUi())+' <b>'+esc(p.location_value||p.pincode||'—')+'</b>. Every successful check is saved as a historical snapshot; new checks do not overwrite older ranks.</div>'
      : '<div class="note"><span class="dot"></span><b>Rank agent not connected yet.</b> Go to Settings and set up the browser rank agent.</div>');
  $('main').innerHTML=pageHead('Search visibility',marketTitle()+' · '+currentMarket.marketplace+' · '+locationLabelUi()+'-based rank monitoring',action)+
  '<div class="stats"><div class="stat"><span>Tracked ASINs</span><b>'+d.summary.products+'</b></div><div class="stat"><span>Tracked Keywords</span><b>'+d.summary.keywords+'</b></div><div class="stat"><span>Tracked Pairs</span><b>'+d.summary.tracked_pairs+'</b></div><div class="stat"><span>Rank Warnings</span><b>'+d.summary.rank_warnings+'</b></div></div>'+
  '<div class="panel"><div class="panelhead"><b>Keyword tracking</b><span class="muted">Daily median organic rank · latest sponsored position</span></div><div class="tablewrap"><table><thead><tr><th>Product</th><th>Keyword</th><th>Priority</th><th>Location</th><th>Search volume (optional)</th><th>Organic</th><th>Target</th><th>Sponsored</th><th>Visibility</th><th>Status</th><th>Last checked</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+providerNote;
  if($('configureMarket')) $('configureMarket').onclick=()=>navigate('settings');
  if($('connectProvider')) $('connectProvider').onclick=()=>navigate('settings');
  if($('runRankCheck')) $('runRankCheck').onclick=async()=>{
    const b=$('runRankCheck');b.disabled=true;b.textContent='Queueing check…';
    try{
      await api('/rank_check_now',{method:'POST',body:'{}'});
      toast('Rank check queued for '+currentMarket.market_name+'. Opera will use '+locationLabelUi()+' '+(p.location_value||p.pincode||'from Settings')+' automatically.');
      b.textContent='Queued';
      setTimeout(()=>renderDashboard(),4000);
    }catch(err){toast(err.message,true);b.disabled=false;b.textContent='Run live rank check'}
  };
}

async function renderProducts(){
  const d=await api('/products');
  const rows=d.products.map(p=>'<tr><td><b>'+esc(p.product_name)+'</b><div class="tiny">'+esc(p.role||'')+'</div></td><td>'+esc(p.asin)+'</td><td>'+p.tracked_keywords+'</td><td>'+statusBadge(p.active?'Active':'Inactive')+'</td><td><button class="btn-sm toggle-product" data-id="'+p.id+'" data-active="'+p.active+'">'+(p.active?'Disable':'Enable')+'</button></td></tr>').join('');
  $('main').innerHTML=pageHead('Products',marketTitle()+' · Manage the ASINs included in rank tracking')+
  '<div class="grid2"><div class="panel"><div class="panelhead"><b>Tracked products</b><span class="muted">'+d.products.length+' ASINs</span></div><div class="tablewrap"><table><thead><tr><th>Product</th><th>ASIN</th><th>Keywords</th><th>Status</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
  '<div class="panel"><div class="panelhead"><b>Add product</b></div><div class="panelbody"><form id="productForm"><label>ASIN</label><input class="field" name="asin" placeholder="B0XXXXXXXX" maxlength="10" required><label>Product name</label><input class="field" name="product_name" placeholder="Zipify..." required><label>Role</label><input class="field" name="role" placeholder="Hero / Growth / Sell-through"><div class="actions"><button class="primary">Save product</button></div></form></div></div></div>';
  $('productForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api('/products',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});toast('Product saved');renderProducts()}catch(err){toast(err.message,true)}};
  document.querySelectorAll('.toggle-product').forEach(b=>b.onclick=async()=>{try{await api('/products/'+b.dataset.id,{method:'PATCH',body:JSON.stringify({active:b.dataset.active!=='true'})});toast('Product updated');renderProducts()}catch(err){toast(err.message,true)}});
}

async function renderKeywords(){
  const [k,p]=await Promise.all([api('/keywords'),api('/products')]);
  const rows=k.keywords.map(x=>'<tr><td><b>'+esc(x.keyword)+'</b></td><td><span class="badge '+(x.priority==='critical'?'bad':x.priority==='high'?'warn':'')+'">'+esc(x.priority)+'</span></td><td>'+(x.search_volume??'—')+'</td><td>'+(x.products.length?x.products.map(q=>'<span class="badge">'+esc(q.asin)+'</span>').join(' '):'<span class="empty">Not tracked</span>')+'</td></tr>').join('');
  const activeProducts=p.products.filter(x=>x.active);
  const productOpts=activeProducts.map(x=>'<option value="'+esc(x.asin)+'">'+esc(x.asin+' · '+x.product_name)+'</option>').join('');
  const bulkProductOpts='<option value="">Add to keyword library only</option>'+productOpts;
  const keywordOpts=k.keywords.filter(x=>x.active).map(x=>'<option value="'+x.id+'">'+esc(x.keyword)+'</option>').join('');

  $('main').innerHTML=pageHead('Keywords',marketTitle()+' · Bulk add keywords and assign them to ASINs · Amazon Brand Analytics search volume refreshes automatically')+
  '<div class="grid2"><div class="panel"><div class="panelhead"><b>Keyword library</b><span class="muted">'+k.keywords.length+' keywords</span></div>'+
  (rows?'<div class="tablewrap"><table><thead><tr><th>Keyword</th><th>Priority</th><th>Search volume</th><th>Tracked ASINs</th></tr></thead><tbody>'+rows+'</tbody></table></div>':emptyState('No keywords yet','Paste your keyword list in the bulk-add form.'))+
  '</div>'+
  '<div><div class="panel"><div class="panelhead"><b>Bulk add keywords</b><span class="badge blue">Up to 200</span></div><div class="panelbody"><form id="bulkKeywordForm">'+
  '<label>Paste keywords</label><textarea class="field" name="keywords_text" rows="10" placeholder="One keyword per line\n\nbeeswax bread bag\nbread storage bag\nreusable bread bag\nsourdough bread bag" required></textarea>'+
  '<div class="tiny" style="margin-top:6px">One per line is best. Commas and semicolons also work. Duplicates are automatically removed.</div>'+
  '<div class="formgrid"><div><label>Priority for this batch</label><select class="field" name="priority"><option>critical</option><option>high</option><option selected>medium</option><option>low</option></select></div>'+
  '<div><label>Optional: track all for product</label><select class="field" name="track_asin">'+bulkProductOpts+'</select></div></div>'+

  if($('testRankNow')) $('testRankNow').onclick=async()=>{
    const b=$('testRankNow');b.disabled=true;b.textContent='Queueing…';
    try{await api('/rank_check_now',{method:'POST',body:'{}'});toast('Queued. Opera will pick it up automatically.');b.textContent='Queued'}catch(err){toast(err.message,true);b.disabled=false;b.textContent='Queue live rank check'}
  };

  if($('adsConnectForm')) $('adsConnectForm').onsubmit=async e=>{
    e.preventDefault();
    const b=e.target.querySelector('button');b.disabled=true;b.textContent='Testing Amazon…';
    try{
      const o=Object.fromEntries(new FormData(e.target));
      await api('/ads_connect',{method:'POST',body:JSON.stringify(o)});
      toast('Amazon Ads connected');
      renderSettings();
    }catch(err){
      toast(err.message,true);
      b.disabled=false;b.textContent='Test & connect Amazon Ads';
    }
  };

  if($('adsSyncNow')) $('adsSyncNow').onclick=async()=>{
    const b=$('adsSyncNow');b.disabled=true;b.textContent='Syncing…';
    try{
      const r=await api('/ads_sync_now',{method:'POST',body:'{}'});
      toast(r.status==='NOT_CONFIGURED'?'Amazon Ads is not configured':'Amazon Ads sync started');
      setTimeout(()=>renderSettings(),1200);
    }catch(err){toast(err.message,true);b.disabled=false;b.textContent='Sync Amazon Ads now'}
  };

  if($('adsDisconnect')) $('adsDisconnect').onclick=async()=>{
    const b=$('adsDisconnect');b.disabled=true;
    try{await api('/ads_disconnect',{method:'POST',body:'{}'});toast('Amazon Ads disconnected');renderSettings()}catch(err){toast(err.message,true);b.disabled=false}
  };
}

const renderers={dashboard:renderDashboard,products:renderProducts,keywords:renderKeywords,campaigns:renderCampaigns,advertising:renderAdvertising,alerts:renderAlerts,reports:renderReports,settings:renderSettings};
async function navigate(view){
  if(!renderers[view])view='dashboard';setNav(view);location.hash=view;$('main').innerHTML='<div class="loader">Loading…</div>';
  try{await ensureMarkets();await renderers[view]()}catch(err){if(err.message!=='Unauthorized'){$('main').innerHTML=pageHead('Something went wrong','The screen could not load')+'<div class="note">'+esc(err.message)+'</div>';toast(err.message,true)}}
}
$('marketSelect').value=selectedMarket;
$('marketSelect').onchange=e=>{
  setCurrentMarket(e.target.value);
  navigate(location.hash.slice(1)||'dashboard');
};
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>navigate(b.dataset.view));
$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  $('loginError').classList.add('hidden');
  const user=$('username').value.trim(),pass=$('password').value;
  try{
    const r=await fetch(API+'?action=login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:user,password:pass})
    });
    const d=await r.json();
    if(!r.ok||!d.session) throw new Error(d.error||'Login failed');
    sessionStorage.removeItem('zri_auth');
    sessionStorage.setItem('zri_session',d.session);
    showApp();
    await navigate(location.hash.slice(1)||'dashboard');
  }catch(err){
    sessionStorage.removeItem('zri_session');
    showLogin();
    $('loginError').textContent=err.message||'Login failed';
    $('loginError').classList.remove('hidden');
  }
});
$('logout').onclick=async()=>{
  try{await fetch(API+'?action=logout',{method:'POST',headers:authHeader()})}catch{}
  sessionStorage.removeItem('zri_session');sessionStorage.removeItem('zri_auth');location.hash='';showLogin()
};
window.addEventListener('hashchange',()=>{if(sessionStorage.getItem('zri_session'))navigate(location.hash.slice(1)||'dashboard')});
sessionStorage.removeItem('zri_auth');
if(sessionStorage.getItem('zri_session')){showApp();navigate(location.hash.slice(1)||'dashboard')}else showLogin();
</script>
</body>
