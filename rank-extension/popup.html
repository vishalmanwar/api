<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Zipify Rank Agent</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="wrap">
    <h1>Zipify Rank Agent</h1>
    <p class="muted">Uses the pincode saved in Zipify Dashboard Settings and sets Amazon.in automatically before every rank check.</p>
    <label>Agent token</label>
    <input id="token" type="password" placeholder="Paste agent token">
    <div class="row">
      <button id="save">Save token</button>
      <button id="run" class="primary">Run now</button>
    </div>
    <div id="status" class="status">Not configured.</div>
    <div class="small">Keep Opera running. Queue polling and scheduled checks are automatic.</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
